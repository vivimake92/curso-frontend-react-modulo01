<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Títulos e textos</title>
</head>
<body>

    <!-- Tags de títulos no HTML -->
    <h1>Texto principal</h1>
    <h2>Título secundário</h2>
    <h3>Texto com grau de importância moderado</h3>

    <h4>Texto com h4</h4>
    <h5>Texto com h5</h5>
    <h6>Texto com h6</h6>

    <hr /> <!-- Tag de linha horizontal -->

    <p><strong>Parágrafo</strong> <br /> <em>simples de texto.</em> <span>Tag span</span></p>

</body>
</html>
