<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulários</title>
  </head>
  <body>
    <form action="./teste.html">
      <h2>Label e Input</h2>

      <fieldset>
        <legend>Dados de Acesso</legend>
        <div>
          <label for="fullName">Nome Completo</label>
          <input
            id="fullName"
            type="text"
            name="fullName"
            placeholder="Digite aqui seu nome"
            required
          />
        </div>

        <div>
          <label for="useremail">E-mail</label>
          <input
            id="useremail"
            type="email"
            name="useremail"
            placeholder="email@exemplo.com"
            required
          />
        </div>

        <div>
          <label for="age">Idade</label>
          <input
            id="age"
            type="number"
            name="age"
            min="18"
            placeholder="Digite aqui sua idade"
            required
          />
        </div>

        <div>
          <label for="password">Senha</label>
          <input
            id="password"
            type="password"
            name="password"
            minlength="6"
            maxlength="10"
            placeholder="Digite aqui sua Senha"
            required
          />
        </div>
      </fieldset>
      <hr />

      <h2>Tipos de Inputs</h2>

      <div>
        <label for="cellphone">Celular</label>
        <input id="cellphone" type="tel" name="cellphone" />
      </div>

      <div>
        <label for="date">Data de Nascimento</label>
        <input id="date" type="date" name="date" min="2026-01-01" />
      </div>

      <div>
        <label for="color">Cor Preferida</label>
        <input id="color" type="color" name="color" />
      </div>

      <hr />

      <h2>Listas e seleções</h2>

      <div>
        <label for="city">Cidade de Nascimento</label>
        <input id="city" type="text" name="city" />
      </div>

      <div>
        <label for="state">Estado de Nascimento</label>
        <select name="state" id="state" required>
          <option value="">Escolha o Estado</option>
          <option value="SC">Santa Catarina</option>
          <option value="PA">Pará</option>
          <option value="RJ">Rio de Janeiro</option>
          <option value="RS">Rio Grande do Sul</option>
          <option value="PE">Pernambuco</option>
          <option value="BH">Bahia</option>
        </select>

        <div>
          <p>Estado Civil</p>
          <label for="married">Casado(a)</label>
          <input type="radio" id="married" name="civil" value="casado(a)" />

          <label for="single">Solteiro(a)</label>
          <input type="radio" id="single" name="civil" value="casado(a)" />

          <label for="widower">Viúvo(a)</label>
          <input type="radio" id="widower" name="civil" value="viuvo(a)" />
        </div>

        <div>
          <p>Veículos</p>
          <label for="bike">Moto</label>
          <input type="checkbox" id="bike" name="vehicle" value="Moto" />

          <label for="car">Carro</label>
          <input type="checkbox" id="car" name="vehicle" value="Carro" />
        </div>
      </div>

      <div>
        <label for="">Digite a sua bio</label>
        <textarea
          name="bio"
          id="bio"
          cols="26"
          rows="10"
          style="resize: none"
        ></textarea>
      </div>
      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
